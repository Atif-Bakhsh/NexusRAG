[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexusrag"
version = "0.1.0"
description = "Comparing Vector and Knowledge-Graph Retrieval for Architecture Documentation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "neo4j>=5.28,<6",
  "torch>=2.6,<3", "sentence-transformers>=3.4,<6", "openai>=2.26,<3", "markdown-it-py>=3,<5",
  "pyyaml>=6,<7", "tiktoken>=0.9,<1", "streamlit>=1.44,<2", "httpx>=0.28,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]
[project.scripts]
nexusrag = "nexusrag.cli:main"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and Neo4j", "model: requires downloaded BGE model"]
[tool.hatch.build.targets.wheel]
packages = ["src/nexusrag"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
